name: faith_mission_app
description: A fluid mobile faith mission app with daily verses, KJV Bible, blog, and gospel-focused chat.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  flutter_riverpod: ^2.4.9
  
  # Navigation
  go_router: ^16.0.0
  
  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  
  # Utilities
  intl: ^0.20.2
  uuid: ^4.2.1
  crypto: ^3.0.3
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  
  # Notifications
  flutter_local_notifications: ^21.0.0
  timezone: ^0.11.0
  
  # Icons
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.7.0
  freezed: ^3.2.0
  json_serializable: ^6.11.0
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  
  assets:
    - assets/data/bible_kjv.json

  # Roboto (SIL Open Font License 1.1, see assets/fonts/OFL.txt) is bundled so
  # the app never needs to download fonts.
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Italic.ttf
          style: italic
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
