name: faith_mission_app
description: A fluid mobile faith mission app with daily verses, KJV Bible, blog, and gospel-focused chat.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  flutter_riverpod: ^2.4.9
  
  # Navigation
  go_router: ^16.0.0
  
  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  
  # Utilities
  intl: ^0.20.2
  uuid: ^4.2.1
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  
  # Notifications
  flutter_local_notifications: ^21.0.0
  timezone: ^0.11.0
  
  # Icons
  cupertino_icons: ^1.0.6
  url_launcher: ^6.3.3
  firebase_core: ^5.2.0
  firebase_auth: ^7.1.0
  cloud_firestore: ^7.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.7.0
  freezed: ^3.2.0
  json_serializable: ^6.11.0
  integration_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  fake_cloud_firestore: ^4.5.0
  firebase_auth_mocks: ^0.16.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/data/bible_kjv.json

  # Roboto (SIL Open Font License 1.1, see assets/fonts/OFL.txt) is bundled so
  # the app never needs to download fonts.
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Italic.ttf
          style: italic
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700

# App icons: `dart run flutter_launcher_icons` regenerates them from assets/icon.
flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: assets/icon/app_icon.png
  adaptive_icon_background: "#1976D2"
  adaptive_icon_foreground: assets/icon/app_icon_foreground.png
  min_sdk_android: 24
  web:
    generate: true
    image_path: assets/icon/app_icon.png
    background_color: "#1976D2"
    theme_color: "#1976D2"
